name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-identity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: agent-identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: No key files may be tracked
        run: |
          if git ls-files | grep -E '\.(pem|key)$|(^|/)\.env'; then
            echo "A key or env file is tracked by git"
            exit 1
          fi
      - run: npm ci
      - run: npm test
